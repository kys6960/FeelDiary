<style>
:root {
  --night: #1f2347; --night-2: #2c3166; --moon: #f1d79e;
  --paper: #fffbf4; --ink: #2a2737; --muted: #6d6780; --petal: #d9637f;
  --on-night: #f6f1e6; --on-night-muted: #b9bcd9;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; min-height: 100dvh;
  background: radial-gradient(120% 70% at 50% 0%, var(--night-2), var(--night) 70%);
  color: var(--on-night);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
}
header { text-align: center; margin: 4px 0 18px; }
header a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
header img { width: 40px; height: 40px; border-radius: 10px; }
h1 { font-family: "Gowun Batang", serif; font-size: 26px; margin: 0; letter-spacing: -0.5px; }
.sub { margin: 8px 0 0; color: var(--moon); font-size: 15px; }
.frame {
  width: min(100%, 420px, calc((100dvh - 230px) * 9 / 16));
  min-width: 260px;
  aspect-ratio: 9 / 16;
  border-radius: 28px; overflow: hidden;
  background: #000;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .08);
  position: relative;
}
video { width: 100%; height: 100%; display: block; object-fit: cover; background: #000; }
.play {
  position: absolute; inset: 0; margin: auto; width: 88px; height: 88px; border-radius: 50%;
  border: 0; background: rgba(217, 99, 127, .92); cursor: pointer;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  display: grid; place-items: center;
}
.play::before { content: ""; margin-left: 7px; border-left: 30px solid #fff; border-top: 19px solid transparent; border-bottom: 19px solid transparent; }
.play[hidden] { display: none; }
.sound { margin: 14px 0 0; color: var(--on-night-muted); font-size: 13px; text-align: center; }
.points { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 420px; }
.points li { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; padding: 6px 13px; font-size: 13px; }
.cta {
  margin-top: 20px; display: inline-block; text-decoration: none;
  background: var(--paper); color: var(--ink); font-weight: 700; font-size: 16px;
  padding: 13px 26px; border-radius: 999px;
}
.cta:focus-visible, .play:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }
</style>
</head>
<body>
<header>
  <a href="../"><img src="../img/icon.png" alt=""><h1>손쉬운일기</h1></a>
  <p class="sub">말하면 꾸며지는 하루 한 쪽 일기</p>
</header>

<div class="frame">
  <video id="v" src="feeldiary_ko.mp4" poster="poster_ko.jpg" preload="metadata" playsinline controls></video>
  <button class="play" id="p" aria-label="영상 재생"></button>
</div>
<p class="sound">🔊 소리를 켜고 보세요 · 30초</p>

<ul class="points">
  <li>광고 없음</li><li>구독 없음</li><li>일기는 내 폰 안에만</li>
</ul>
<a class="cta" href="../">앱 더 알아보기</a>

<script>
const v = document.getElementById('v'), p = document.getElementById('p');
p.addEventListener('click', () => { v.play(); });
v.addEventListener('play', () => { p.hidden = true; });
v.addEventListener('pause', () => { if (!v.seeking) p.hidden = false; });
v.addEventListener('ended', () => { p.hidden = false; });
</script>
</body>
</html>
